<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b5d3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trip Book</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--g:#0b5d3b;--g2:#13804f;--bg:#f2f5f3;--card:#fff;--tx:#14201a;--mu:#66756d;--red:#c62828;--amb:#e08a00;--blu:#1565c0;--bd:#dfe6e2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Roboto,sans-serif;font-size:16px}
header{position:fixed;top:0;left:0;right:0;height:56px;background:var(--g);color:#fff;display:flex;align-items:center;padding:0 14px;z-index:20;box-shadow:0 2px 6px #0003}
header h1{font-size:19px;margin:0;flex:1}
header button{background:#ffffff26;color:#fff;border:0;border-radius:10px;height:38px;padding:0 12px;font-size:14px}
main{padding:66px 12px 150px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;display:flex;border-top:1px solid var(--bd);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:21px;font-weight:400}
nav button.on{color:var(--g);font-weight:700}
.fab{position:fixed;right:16px;bottom:78px;z-index:25;height:60px;border-radius:30px;border:0;background:var(--g2);color:#fff;font-size:18px;font-weight:700;padding:0 22px;box-shadow:0 4px 12px #0005}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--bd)}
.stat small{display:block;color:var(--mu);font-size:12px;line-height:1.25}
.stat strong{font-size:21px;display:block;margin-top:4px}
.red{color:var(--red)}.grn{color:var(--g2)}.blu{color:var(--blu)}
h2{font-size:16px;margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.card .top{display:flex;justify-content:space-between;align-items:center}
.veh{font-weight:800;font-size:18px;letter-spacing:.5px}
.route{margin:4px 0;font-size:15px}
.meta{color:var(--mu);font-size:13px;line-height:1.5}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:12px;color:#fff;font-weight:600}
.s-Waiting{background:#6a1b9a}.s-Running{background:var(--blu)}.s-Unload-Pending{background:var(--amb)}.s-Payment-Pending{background:var(--red)}.s-Bill-Company-Done{background:#00838f}.s-Bill-Done{background:var(--g2)}.s-Transporter-Paid{background:#1b5e20}.s-Transporter-Pending{background:#ef6c00}
.chkrow{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;margin:0 0 8px;padding:12px;border:1.5px solid #c9d3ce;border-radius:12px;background:#fff}
.chkrow input{width:26px;height:26px;margin:0;flex:none;accent-color:var(--g2)}
.chkrow:has(input:checked){border-color:var(--g2);background:#e8f5ee}
.waitl{font-size:13px;margin-top:4px;color:var(--mu)}.waitl.over{color:var(--red);font-weight:700}
.remrow{display:block;width:100%;text-align:left;border:1.5px solid var(--red);background:#fdecea;color:#8c1c13;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.4;font-family:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dues{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.due{font-size:13px;padding:4px 8px;border-radius:8px;background:#f3f6f4}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{flex:1;height:44px;border:0;border-radius:10px;font-size:15px;font-weight:600;color:#fff}
.wa{background:#25d366}.ed{background:var(--blu)}.dl{background:var(--red);flex:.6!important}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}
label i{font-style:normal;color:var(--mu);font-weight:400;font-size:12px}
input,select,textarea{width:100%;height:50px;border:1.5px solid #c9d3ce;border-radius:12px;padding:0 12px;font-size:17px;background:#fff;color:var(--tx);font-family:inherit}
textarea{height:80px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:48px;border:1.5px solid #c9d3ce;background:#fff;border-radius:12px;font-size:15px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--g2);border-color:var(--g2);color:#fff}
.seg button.on.no{background:var(--red);border-color:var(--red)}
.seg button.on.pa{background:var(--amb);border-color:var(--amb)}
.big{width:100%;height:56px;border:0;border-radius:14px;background:var(--g2);color:#fff;font-size:18px;font-weight:700;margin-top:18px}
.big.alt{background:#fff;color:var(--g);border:2px solid var(--g2)}
.big.gry{background:#8a9690}
.profit{background:#e8f5ee;border:1px dashed var(--g2);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:15px;line-height:1.6}
.filters{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.filters input,.filters select{height:44px;font-size:15px;margin-bottom:8px}
.mbar{display:flex;gap:8px;margin-bottom:8px}
.mbar button{width:56px;height:44px;border:0;border-radius:10px;background:var(--g2);color:#fff;font-size:18px}
.mbar input{flex:1;margin:0!important;font-size:17px;font-weight:700;text-align:center}
.tog{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:0}
.tog input{width:24px;height:24px;margin:0}
.bk{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.4;font-family:inherit}
.bk.warn{background:#fdecea;color:#8c1c13;border:1.5px solid var(--red)}
.bk.ok{background:#e8f5ee;color:#0b5d3b;border:1px solid var(--bd);font-size:13px;padding:8px 12px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--mu);line-height:1.5;margin-top:10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px}
.mc h3{margin:0 0 10px;font-size:17px}
.mrow{display:flex;align-items:center;justify-content:space-between;background:#f7faf8;border:1px solid var(--bd);border-radius:10px;padding:6px 6px 6px 12px;margin-top:6px;gap:8px}
.mrow span{flex:1;word-break:break-word}
.mrow button{border:0;background:var(--red);color:#fff;border-radius:8px;height:42px;min-width:60px;font-size:18px}
.addbtn{margin-top:8px!important;height:48px!important;font-size:16px!important}
.mrow button.btn2{height:38px;min-width:0;font-size:13px;padding:0 10px;border-radius:8px;background:var(--blu);color:#fff}.mrow button.btn2.y{background:var(--amb)}.mrow button.btn2.r{background:var(--red)}.mrow button.btn2.g{background:var(--g2)}
nav button{font-size:10.5px}nav button b{font-size:19px}
.s-Stage{background:#455a64}
.st0{background:#78909c}.st1{background:#6a1b9a}.st2{background:#8e24aa}.st3{background:#1565c0}.st4{background:#00838f}.st5{background:#ef6c00}.st6{background:#d84315}.st7{background:#2e7d32}.st8{background:#c62828}.st9{background:#1b5e20}
.tile{background:var(--card);border-radius:14px;padding:10px 12px;border:1.5px solid var(--bd);text-align:left;font-family:inherit;color:var(--tx)}
.tile small{display:block;color:var(--mu);font-size:12px;line-height:1.25}
.tile strong{font-size:24px;display:block;margin-top:2px}
.tile.sel{border-color:var(--g2);background:#e8f5ee}
.stg{width:100%;height:40px;font-size:14px;margin-top:8px;padding:0 8px;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.tabs button{flex:none;height:40px;padding:0 14px;border:1.5px solid #c9d3ce;background:#fff;border-radius:20px;font-size:14px;font-weight:600;color:var(--mu)}
.tabs button.on{background:var(--g2);border-color:var(--g2);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
table.t th{background:#e8f5ee;text-align:left;padding:6px;font-size:12px}
table.t td{padding:6px;border-top:1px solid var(--bd);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:15px}
.kv:last-child{border-bottom:0}
.btn2{height:40px;border:0;border-radius:10px;background:var(--blu);color:#fff;font-size:14px;font-weight:600;padding:0 12px}
.btn2.r{background:var(--red)}.btn2.g{background:var(--g2)}.btn2.y{background:var(--amb)}.btn2.k{background:#8a9690}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#e3e9e6;color:#33433a;font-weight:700;margin-right:4px}
.badge.rcm{background:#fff3e0;color:#b45f00}.badge.gst{background:#e3f2fd;color:#0d47a1}.badge.ba{background:#ede7f6;color:#4527a0}.badge.dir{background:#e0f2f1;color:#00695c}.badge.off{background:#ffebee;color:#c62828}
#modal{position:fixed;inset:0;background:#0007;z-index:90;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px 24px}
#modal h3{margin:0 0 6px;font-size:18px}
.payrow{border:1px solid var(--bd);background:#f7faf8;border-radius:12px;padding:8px;margin-top:8px}
.payrow .row2 input{height:44px;font-size:15px}
.payrow label.tog{margin-top:6px;font-size:13px}
#invv{position:fixed;inset:0;background:#e9ecea;z-index:80;display:none;overflow:auto}
#invv.on{display:block}
#invv .bar{position:sticky;top:0;background:var(--g);display:flex;gap:6px;padding:8px;z-index:2;flex-wrap:wrap}
#invv .bar button{flex:1;min-width:80px;height:40px;border:0;border-radius:10px;font-size:14px;font-weight:700;background:#fff;color:var(--g)}
#invwrap{transform-origin:top left;width:794px;margin:8px 0}
.inv{width:794px;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#000;padding:0}
.inv img.hd{width:100%;display:block}
.inv .pad{padding:6px 28px}
.inv h1{font-size:19px;color:#0f3b57;text-align:center;margin:8px 0 0;letter-spacing:.5px}
.inv .sub{text-align:center;font-size:11px;margin:2px 0 8px}
.inv table{width:100%;border-collapse:collapse}
.inv td,.inv th{border:1px solid #000;font-size:10.5px;padding:3px 5px}
.inv .lb{background:#dce6ee;font-weight:700;font-size:10.5px}
.inv th{background:#dce6ee;font-size:9.5px;text-align:center}
.inv td.rt{text-align:right}.inv td.ct{text-align:center}
.inv tr.blank td{height:18px}
.inv .gt td{font-weight:700}.inv .gt td:last-child{background:#e3efda}
.inv .note{background:#fde9d9;border:1px solid #000;padding:5px 7px;font-size:10px;margin-top:6px;line-height:1.35;color:#000}
.inv img.ft{width:100%;display:block;margin-top:8px}
.inv .sg{text-align:center;height:100px}.inv .sg img{height:90px}
@media print{
 @page{size:A4;margin:0}
 body>*:not(#invv){display:none!important}
 #invv{position:static;display:block!important;background:#fff;overflow:visible}
 #invv .bar{display:none!important}
 #invwrap{transform:none!important;margin:0;width:210mm}
 .inv{width:210mm}
}
</style>
</head>
<body>
<header><h1 id="ttl">🚛 Trip Book</h1><button id="inst" style="display:none">⬇ Install</button></header>
<main>

<!-- DASHBOARD (operational only) -->
<section class="view on" id="v-home">
  <div id="rem-box"></div>
  <button class="bk ok" id="bk-banner" type="button" style="display:none"></button>
  <div class="filters">
    <div class="mbar"><button id="d-prev" type="button">◀</button><input id="d-month" type="month"><button id="d-next" type="button">▶</button></div>
    <div class="row2"><select id="d-veh"></select><select id="d-drv"></select></div>
    <select id="d-cli" style="margin-bottom:0"></select>
  </div>
  <div class="grid" id="d-tiles"></div>
  <h2 id="d-lt">Select a box above</h2>
  <div id="d-list"></div>
</section>

<!-- TRIPS LIST -->
<section class="view" id="v-list">
  <div class="filters">
    <div class="mbar"><button id="m-prev" type="button">◀</button><input id="f-month" type="month"><button id="m-next" type="button">▶</button></div>
    <button class="big alt" style="height:40px;margin:0 0 8px;font-size:14px" id="m-all" type="button">Show all months</button>
    <input id="f-q" type="search" placeholder="🔍 Vehicle / Client / Driver / Transporter / OMC / LR / Invoice">
    <div class="row2">
      <div><small>From date</small><input id="f-from" type="date"></div>
      <div><small>To date</small><input id="f-to" type="date"></div>
    </div>
    <select id="f-stage"></select>
    <div class="row2"><select id="f-drv"></select><select id="f-src"><option value="">Source: All</option><option value="BA">B.A trips</option><option value="Direct">Direct trips</option></select></div>
    <select id="f-st"><option value="">All tick-box Status</option><option value="Waiting">Waiting for Loading</option><option value="Running">Running</option><option value="Unload Pending">Unload Pending</option><option value="Bill Company Done">Bill to Company Done</option><option value="Payment Pending">Payment Pending</option><option value="Bill Done">Bill to Transporter Done</option><option value="Transporter Pending">Payment to Transporter Pending</option><option value="Transporter Paid">Payment to Transporter Done</option></select>
    <select id="f-bill"><option value="">Billing: All</option><option value="unbilled">Not billed</option><option value="billed">Billed</option></select>
    <label class="tog"><input type="checkbox" id="f-pend"> Payment pending only</label>
    <button class="big gry" style="height:44px;margin-top:10px;font-size:15px" id="f-clr">Reset Filters</button>
  </div>
  <div id="cnt" class="note" style="margin:0 4px 8px"></div>
  <div id="cards"></div>
</section>

<!-- FORM -->
<section class="view" id="v-form">
  <h2 id="f-title" style="font-size:19px">➕ New Trip</h2>
  <div class="note" id="f-billed" style="margin:0;display:none;color:var(--red);font-weight:700"></div>
  <div class="note" style="margin:0">Client, Vehicle, Driver, Transporter and Terminal come from your lists. To add or delete them, open the <b>Masters</b> tab.</div>
  <label>Date of Loading *</label><input id="t-date" type="date">
  <label>Vehicle / TT Number *</label><select id="t-veh"></select>
  <label>Driver <i>(from Driver Master)</i></label><select id="t-drv"></select>
  <label>Loading Terminal (From) *</label><select id="t-from"></select>
  <label>Destination (To) *</label><input id="t-to" placeholder="Ahmedabad">
  <label>OMC *</label>
  <select id="t-omc"></select>
  <label>Material *</label><input id="t-mat" placeholder="LPG">
  <label>Qty (MT) *</label><input id="t-qty" type="number" inputmode="decimal" placeholder="20">
  <label>LR No. / Invoice No. <i>(optional)</i></label><input id="t-lr" placeholder="LR or invoice number">
  <div class="row2">
    <div><label>Freight Rate ₹/MT *</label><input id="t-fr" type="number" inputmode="decimal" placeholder="0"></div>
    <div><label>My Commission ₹/MT *</label><input id="t-cm" type="number" inputmode="decimal" placeholder="0"></div>
  </div>
  <label>Client (Company) *</label><input id="t-party" list="cli-dl" placeholder="Client / company name" autocomplete="off"><datalist id="cli-dl"></datalist>
  <label>Transporter *</label><select id="t-tn"></select>

  <label>Trip Source * <i>(choose every time)</i></label>
  <div class="seg" id="sg-src"><button data-v="BA">B.A</button><button data-v="Direct">Direct</button></div>
  <div id="ba-wrap"><label>B.A *</label><select id="t-ba"></select></div>

  <label>Tax type for billing * <i>(choose every time)</i></label>
  <div class="seg" id="sg-tax"><button data-v="RCM">RCM</button><button data-v="GST">GST</button></div>

  <label>Trip Stage *</label>
  <select id="t-stage"></select>
  <div id="uc-wrap" style="display:none"><label>Unloading completed at</label><input id="t-uct" type="datetime-local"></div>

  <label>💰 Received from Client <i>(part payments allowed — each editable)</i></label>
  <div id="pay-r"></div>
  <button class="btn2 g" type="button" id="add-r" style="margin-top:8px;width:100%">＋ Add received payment</button>
  <label>🚚 Paid to Transporter <i>(part payments allowed — each editable)</i></label>
  <div id="pay-p"></div>
  <button class="btn2 g" type="button" id="add-p" style="margin-top:8px;width:100%">＋ Add payment made</button>

  <div class="profit" id="t-calc"></div>

  <label>Trip Status (tick boxes)</label>
  <div class="note" style="margin:0 0 8px">Tick all that apply.</div>
  <div id="t-st-box">
    <label class="chkrow"><input type="checkbox" value="Waiting"> Waiting for Loading</label>
    <label class="chkrow"><input type="checkbox" value="Running"> Running (on the way)</label>
    <label class="chkrow"><input type="checkbox" value="Unload Pending"> Unload Pending</label>
    <label class="chkrow"><input type="checkbox" value="Bill Company Done"> Bill to Company Done</label>
    <label class="chkrow"><input type="checkbox" value="Payment Pending"> Payment Pending</label>
    <label class="chkrow"><input type="checkbox" value="Bill Done"> Bill to Transporter Done</label>
    <label class="chkrow"><input type="checkbox" value="Transporter Pending"> Payment to Transporter Pending</label>
    <label class="chkrow"><input type="checkbox" value="Transporter Paid"> Payment to Transporter Done</label>
  </div>
  <div id="ws-wrap"><label>Waiting since <i>(date)</i></label><input id="t-ws" type="date"></div>
  <label>Remarks <i>(optional)</i></label><textarea id="t-rm"></textarea>

  <button class="big" id="t-save">💾 Save</button>
  <button class="big gry" id="t-cancel">← Back</button>
</section>

<!-- ACCOUNTS -->
<section class="view" id="v-acc">
  <h2 style="font-size:19px;margin-top:4px">💰 Accounts</h2>
  <div class="filters">
    <select id="a-per"></select>
    <input id="a-mon" type="month" style="margin-bottom:0;display:none">
  </div>
  <div id="a-body"></div>
</section>

<!-- BILLING -->
<section class="view" id="v-bill">
  <h2 style="font-size:19px;margin-top:4px">🧾 Billing</h2>
  <div class="tabs" id="b-tabs"><button data-b="new" class="on">New Invoice</button><button data-b="hist">Invoice History</button></div>
  <div id="b-body"></div>
</section>

<!-- MASTERS -->
<section class="view" id="v-master">
  <h2 style="font-size:19px;margin-top:4px">🗂 Masters</h2>
  <div class="tabs" id="m-tabs"><button data-m="veh" class="on">Vehicles</button><button data-m="drv">Drivers</button><button data-m="ba">B.A</button><button data-m="oth">Transporter / Terminal / OMC</button><button data-m="set">Settings &amp; Data</button></div>
  <div id="m-body"></div>
</section>

<!-- ANALYSIS -->
<section class="view" id="v-ana">
  <h2 style="font-size:19px;margin-top:4px">📊 Analysis</h2>
  <div class="filters">
    <select id="n-mode"><option value="m">Month</option><option value="y">Full year</option><option value="all">All time</option></select>
    <div class="mbar" id="n-mrow" style="margin-bottom:0"><button id="n-prev" type="button">◀</button><input id="n-month" type="month"><button id="n-next" type="button">▶</button></div>
    <input id="n-year" type="number" min="2000" max="2100" style="display:none;margin-bottom:0">
  </div>
  <div id="n-body"></div>
</section>
</main>

<button class="fab" id="fab">＋ New Trip</button>
<nav>
  <button data-go="home" class="on"><b>🏠</b>Dashboard</button>
  <button data-go="list"><b>📋</b>Trips</button>
  <button data-go="acc"><b>💰</b>Accounts</button>
  <button data-go="bill"><b>🧾</b>Billing</button>
  <button data-go="master"><b>🗂</b>Masters</button>
  <button data-go="ana"><b>📊</b>Analysis</button>
</nav>

<script>
(function(){
'use strict';
const KEY='tripbook_v1', MKEY='tripbook_master', DKEY='tripbook_db2', PKEY='tripbook_preupgrade';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>parseFloat(v)||0;
const r2=n=>Math.round(n*100)/100;
const rh=n=>{const s=n<0?-1:1;return s*Math.round(Math.abs(n)*100+1e-7)/100}; // half-away-from-zero (Excel style)
const fmtQ=q=>String(Math.round(num(q)*1000)/1000);
const inr=n=>(n<0?'-':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const inr2=n=>(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtD=s=>{if(!s)return'';const p=s.split('-');return p[2]+'-'+p[1]+'-'+p[0]};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const normV=v=>String(v||'').toUpperCase().replace(/\s+/g,'');
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monLabel=m=>MONTHS[+m.slice(5,7)-1]+' '+m.slice(0,4);
const fmtDT=ts=>{if(!ts)return'';const d=new Date(ts);return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const toLocalDT=ts=>{const d=new Date(ts||Date.now());return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const BKKEY='tripbook_lastbackup';
const getBk=()=>{try{return +localStorage.getItem(BKKEY)||0}catch(e){return 0}};
const setBk=()=>{try{localStorage.setItem(BKKEY,String(Date.now()))}catch(e){}};

/* ---------- modal helpers (no browser confirm/prompt) ---------- */
function modal(html,wire){$('#mbox').innerHTML=html;$('#modal').classList.add('on');if(wire)wire($('#mbox'))}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function ask(msg,okLabel,cb,danger){
  modal('<h3>'+esc(okLabel==='OK'?'Please confirm':'Confirm')+'</h3><div style="font-size:15px;line-height:1.5;margin:8px 0 14px">'+msg+'</div><div class="row2"><button class="big gry" style="margin:0" id="ak-no">Cancel</button><button class="big" style="margin:0;'+(danger?'background:var(--red)':'')+'" id="ak-ok">'+esc(okLabel)+'</button></div>',
   m=>{m.querySelector('#ak-no').onclick=closeModal;m.querySelector('#ak-ok').onclick=()=>{closeModal();cb()}});
}

/* ---------- storage ---------- */
const rd=(k,d)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}};
const wr=(k,v)=>localStorage.setItem(k,JSON.stringify(v)); // throws on failure
let trips=[];
let master={veh:[],trn:[],term:[],ba:[],omc:[],termPlace:{}};
function defDB(){return{v:3,migrated:0,clients:[],drivers:[],bas:[],ledger:[],invoices:[],
  settings:{ledgerStart:'2026-10-01',openAmt:0,openSet:false,
   series:{prefix:'ND',counters:{'2026-27':6}},
   firm:{name:'K.K ENTERPRISE',gstin:'24AZKPJ9397A1Z5',pan:'AZKPJ9397A',bank:'BARODA GUJARAT GRAMIN BANK',acc:'76360200000020',ifsc:'BARB0BGGBXX',cgst:9,sgst:9,hsn:'996511'}}}}
let db=defDB();
function loadDB(){
  const d=defDB(),s=rd(DKEY,{});
  db=Object.assign(d,s);
  const ds=defDB().settings;
  db.settings=Object.assign(ds,s.settings||{});
  db.settings.firm=Object.assign(ds.firm,(s.settings&&s.settings.firm)||{});
  db.settings.series=Object.assign(ds.series,(s.settings&&s.settings.series)||{});
  ['clients','drivers','bas','ledger','invoices'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
}
function loadAll(){trips=rd(KEY,[]);if(!Array.isArray(trips))trips=[];loadDB();loadMaster()}
function loadMaster(){const m=rd(MKEY,null);if(m){master.veh=m.veh||[];master.trn=m.trn||[];master.term=m.term||[];master.ba=m.ba||[];master.omc=Array.isArray(m.omc)?m.omc:master.omc;master.termPlace=m.termPlace||{}}}
const save=()=>{try{wr(KEY,trips);return true}catch(e){toast('⚠ Save failed — storage full?');return false}};
const saveDB=()=>{try{wr(DKEY,db);return true}catch(e){toast('⚠ Save failed — storage full?');return false}};
const saveM=()=>{try{wr(MKEY,master)}catch(e){}};
let rem={load:2,unl:2};
try{const r=JSON.parse(localStorage.getItem('tripbook_rem')||'null');if(r&&r.load>0&&r.unl>0)rem=r}catch(e){}

/* ---------- constants ---------- */
const STL={'Waiting':'Waiting for Loading','Running':'Running','Unload Pending':'Unload Pending','Bill Company Done':'Bill to Company Done','Payment Pending':'Payment Pending','Bill Done':'Bill to Transporter Done','Transporter Pending':'Payment to Transporter Pending','Transporter Paid':'Payment to Transporter Done'};
const TRANSIT=['Waiting','Running','Unload Pending'];
const WAITING=['Waiting','Unload Pending'];
const STAGES=['Planned','Going for Loading','Waiting for Loading','Loaded / In Transit','Reached Unloading Point','Waiting for Unloading','Currently Unloading','Unloading Completed','Payment Pending – Bill Done to Company','Completed'];
const S_UC=7, S_BILL=8, S_DONE=9;
const stIdx=t=>STAGES.indexOf(t.stage);
const INITIAL=['Planned','Going for Loading','Waiting for Loading'];
const STAGE_TICK={'Waiting for Loading':'Waiting','Loaded / In Transit':'Running','Reached Unloading Point':'Unload Pending','Waiting for Unloading':'Unload Pending'};
const sts=t=>Array.isArray(t.statuses)?t.statuses:(t.status?[t.status]:[]);
const hasSt=(t,k)=>sts(t).includes(k);
const isWaiting=t=>sts(t).some(x=>WAITING.includes(x));
const stageChip=t=>t.stage?'<span class="chip st'+stIdx(t)+'">'+esc(t.stage)+'</span>':'';

/* ---------- lookups (history stays intact if a master item is deactivated/renamed) ---------- */
const cliById=id=>db.clients.find(x=>x.id===id);
const drvById=id=>db.drivers.find(x=>x.id===id);
const baById=id=>db.bas.find(x=>x.id===id);
const cliName=t=>(t.clientId&&cliById(t.clientId)?cliById(t.clientId).name:t.party)||'';
const drvName=t=>(t.driverId&&drvById(t.driverId)?drvById(t.driverId).name:t.driverName)||'';
const baName=t=>(t.baId&&baById(t.baId)?baById(t.baId).name:t.ba)||'';

/* ---------- migration (non-destructive; adds fields, never removes) ---------- */
function migrateTrip(t){
  if(!Array.isArray(t.statuses))t.statuses=t.status?[t.status]:[];
  if(t.status&&!STL[t.status]){
    if(t.status==='Reached')t.status='Unload Pending';
    else if(['Unloaded','Delivered','Completed'].includes(t.status)){const c=calc(t);t.status=(c.partyDue>0||c.transDue>0)?'Payment Pending':'Bill Done'}
    else t.status='Running';
    if(!t.statuses.length||t.statuses.some(x=>!STL[x]))t.statuses=[t.status];
  }
  if(WAITING.includes(t.status)&&!t.waitSince)t.waitSince=t.date||'';
  // part payments
  if(!Array.isArray(t.recvs)){t.recvs=num(t.recvAmt)>0?[{id:uid(),date:t.date||'',amt:num(t.recvAmt),ref:t.recvRef||'',bank:false}]:[]}
  if(!Array.isArray(t.paids)){t.paids=num(t.paidAmt)>0?[{id:uid(),date:t.paidOn||t.date||'',amt:num(t.paidAmt),ref:t.paidRef||'',bank:false}]:[]}
  if(t.tripSource===undefined)t.tripSource=t.ba?'BA':'';
  if(t.taxMode===undefined)t.taxMode='';
  if(t.driverId===undefined){t.driverId='';t.driverName=t.driverName||''}
  if(t.stage===undefined){
    const s=sts(t);
    t.stage=s.includes('Bill Company Done')?STAGES[S_BILL]:s.includes('Unload Pending')?'Waiting for Unloading':s.includes('Running')?'Loaded / In Transit':s.includes('Waiting')?'Waiting for Loading':'';
    t.stageTimes={};t.stageLog=[];
  }
  if(!t.stageTimes)t.stageTimes={};if(!Array.isArray(t.stageLog))t.stageLog=[];
  if(t.invoiceNo===undefined){t.invoiceNo='';t.invoiceId=''}
}
function migrateAll(){
  // 1) safety copy of the raw pre-upgrade data (once)
  try{
    if(!localStorage.getItem(PKEY)){
      const rt=localStorage.getItem(KEY),rm=localStorage.getItem(MKEY);
      if(rt||rm)localStorage.setItem(PKEY,JSON.stringify({at:Date.now(),trips:rt,master:rm}));
    }
  }catch(e){}
  // 2) old master lists, as before
  if(!localStorage.getItem(MKEY)){
    let old=null;try{old=JSON.parse(localStorage.getItem('tripbook_veh')||'null')}catch(e){}
    master.veh=Array.isArray(old)?old.slice():[];
    trips.forEach(t=>{
      if(!Array.isArray(old)&&t.vehicle&&!master.veh.includes(t.vehicle))master.veh.push(t.vehicle);
      if(t.tname&&!master.trn.some(x=>x.n===t.tname))master.trn.push({n:t.tname,p:t.tphone||''});
      if(t.from&&!master.term.some(x=>x.toLowerCase()===String(t.from).toLowerCase()))master.term.push(t.from);
    });
  }
  ['IOCL','BPCL','HPCL'].forEach(v=>{if(!master.omc.includes(v))master.omc.push(v)});
  trips.forEach(t=>{if(t.omc&&!master.omc.some(x=>x.toLowerCase()===String(t.omc).toLowerCase()))master.omc.push(t.omc)});
  // 3) per-trip fields
  trips.forEach(migrateTrip);
  // 4) client / B.A master from existing text
  const keyC=n=>String(n||'').trim().toLowerCase();
  trips.forEach(t=>{
    if(t.party&&String(t.party).trim()){
      let c=db.clients.find(x=>keyC(x.name)===keyC(t.party));
      if(!c){c={id:'c'+uid(),name:String(t.party).trim(),address:'',gstin:'',phone:'',active:true};db.clients.push(c)}
      if(!t.clientId)t.clientId=c.id;
    }
  });
  const baNames=new Set(master.ba);trips.forEach(t=>{if(t.ba)baNames.add(t.ba)});
  baNames.forEach(n=>{if(n&&!db.bas.some(x=>keyC(x.name)===keyC(n)))db.bas.push({id:'b'+uid(),name:n,active:true})});

  try{wr(KEY,trips);wr(DKEY,db);wr(MKEY,master)}catch(e){}
}

/* ---------- calculations ---------- */
const sumA=a=>(a||[]).reduce((s,x)=>s+num(x.amt),0);
function syncPay(t){
  t.recvAmt=r2(sumA(t.recvs));t.paidAmt=r2(sumA(t.paids));
  const last=a=>a.length?[...a].sort((x,y)=>(x.date||'').localeCompare(y.date||''))[a.length-1]:null;
  const lr=last(t.recvs||[]),lp=last(t.paids||[]);
  t.recvRef=lr?lr.ref||'':'';t.paidRef=lp?lp.ref||'':'';
  if(lp)t.paidOn=lp.date||t.paidOn||'';
  // billed trip: fully paid -> Completed; if a payment is removed -> back to Payment Pending
  if(t.invoiceId&&t.stage){const due=calc(t).partyDue;
    if(t.stage===STAGES[S_BILL]&&t.recvAmt>0&&due===0)setStage(t,STAGES[S_DONE],undefined,true);
    else if(t.stage===STAGES[S_DONE]&&due>0)setStage(t,STAGES[S_BILL],undefined,true);}
  const fr=grossOf(num(t.freight),t.taxMode),tr=num(t.freight)-num(t.comm);
  t.recvStatus=t.recvAmt>=fr-1&&fr>0?'Yes':t.recvAmt>0?'Partial':'No';
  t.paidStatus=t.paidAmt>=tr&&tr>0?'Yes':t.paidAmt>0?'Partial':'No';
}
const taxRate=mode=>mode==='GST'?(num(db.settings.firm.cgst)+num(db.settings.firm.sgst))/100:0;
const grossOf=(fr,mode)=>r2(fr+fr*taxRate(mode));   // what the client owes: freight (+ GST on GST-type trips)
function calc(t){
  const fr=num(t.freight),cm=num(t.comm),rc=num(t.recvAmt),pd=num(t.paidAmt);
  const transTotal=fr-cm,gross=(t.billGross!=null&&t.invoiceId)?num(t.billGross):grossOf(fr,t.taxMode);
  const pdue=r2(gross-rc);
  return{fr,cm,rc,pd,transTotal,gross,tax:r2(gross-fr),profit:rc-pd,
    partyDue:pdue>1?pdue:0,                     // up to Re 1 of bill round-off is treated as settled
    transDue:Math.max(0,r2(transTotal-pd))};
}
const isPend=t=>{const c=calc(t);return c.partyDue>0||c.transDue>0};
const daysSince=d=>{if(!d)return 0;const a=d.split('-'),n=new Date();return Math.max(0,Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(+a[0],+a[1]-1,+a[2]))/86400000))};
const limitFor=t=>hasSt(t,'Waiting')?rem.load:rem.unl;
const matLabel=t=>(t.material||'')+(t.qty?' · '+fmtQ(t.qty)+' MT':'');

/* ---------- stage handling ---------- */
function syncTicks(t){
  // keep the "transit" tick-boxes in step with the stage (other tick-boxes untouched)
  const want=STAGE_TICK[t.stage];
  const had=sts(t).find(x=>TRANSIT.includes(x));
  t.statuses=sts(t).filter(x=>!TRANSIT.includes(x));
  if(want)t.statuses.unshift(want);
  t.status=t.statuses[0]||'';
  const nowW=WAITING.includes(want||'');
  if(nowW){if(want!==had||!t.waitSince)t.waitSince=todayStr()}else t.waitSince='';
}
function setStage(t,stage,ts,noTick){
  ts=ts||Date.now();
  t.stageTimes=t.stageTimes||{};t.stageLog=t.stageLog||[];
  if(t.stage!==stage){
    t.stage=stage;t.stageLog.push({s:stage,ts});
    t.stageTimes[stage]=ts;
    if(STAGES.indexOf(stage)>=S_UC&&t.stageTimes[STAGES[S_UC]]==null)t.stageTimes[STAGES[S_UC]]=ts;
    if(!noTick)syncTicks(t);
  }
}
function changeStage(id,stage){
  const t=trips.find(x=>x.id===id);if(!t||t.stage===stage)return;
  const snap=JSON.stringify(t);
  setStage(t,stage);
  if(!save()){Object.assign(t,JSON.parse(snap));return}
  toast('Stage: '+stage);refreshView();
}
const ucTime=t=>(stIdx(t)>=S_UC&&t.stageTimes)?t.stageTimes[STAGES[S_UC]]||null:null;
const ACTIVE_STAGES=STAGES.slice(0,7);
/* idle after unloading: last trip finished unloading > 8h ago and no newer trip assigned */
const IDLE_H=8;
function idleList(list){
  const now=Date.now(),by={};
  (list||trips).forEach(t=>{if(t.vehicle)(by[t.vehicle]=by[t.vehicle]||[]).push(t)});
  const out=[];
  Object.keys(by).forEach(v=>{
    let last=null;
    by[v].forEach(t=>{const u=ucTime(t);if(u&&(!last||u>last.ts))last={t,ts:u}});
    if(!last)return;
    const hrs=(now-last.ts)/36e5;
    if(hrs<=IDLE_H)return;
    const others=by[v].filter(x=>x!==last.t);
    if(others.some(x=>(x.created||0)>last.ts))return;            // a new trip was assigned after unloading
    if(others.some(x=>ACTIVE_STAGES.includes(x.stage)&&x.stage!=='Planned'))return; // truck is busy on another trip
    out.push({t:last.t,ts:last.ts,hrs});
  });
  return out.sort((a,b)=>b.hrs-a.hrs);
}
const fmtHrs=h=>{const m=Math.floor(h*60),H=Math.floor(m/60);return H>=24?Math.floor(H/24)+'d '+(H%24)+'h '+(m%60)+'m':H+'h '+(m%60)+'m'};

function restoreFile(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);const arr=Array.isArray(d)?d:d.trips;
      if(!Array.isArray(arr))throw 0;
      ask(arr.length+' trips found. Merge with existing data? (existing records are kept; nothing is overwritten)','Merge',()=>{
        const ids=new Set(trips.map(t=>t.id));let n=0;
        const sdb=d.db||{};
        const idMap={};
        const mergeById=(k)=>{(sdb[k]||[]).forEach(x=>{if(!x||!x.id)return;
          if(db[k].some(y=>y.id===x.id))return;
          const same=x.name?db[k].find(y=>y.name&&y.name.trim().toLowerCase()===x.name.trim().toLowerCase()):null;
          if(same)idMap[x.id]=same.id;else db[k].push(x)})};
        ['clients','drivers','bas','ledger'].forEach(mergeById);
        (sdb.invoices||[]).forEach(x=>{if(x&&x.id&&!db.invoices.some(y=>y.id===x.id||y.no===x.no)){if(idMap[x.clientId])x.clientId=idMap[x.clientId];db.invoices.push(x)}});
        arr.forEach(t=>{if(t&&t.id&&!ids.has(t.id)){['clientId','driverId','baId'].forEach(k=>{if(idMap[t[k]])t[k]=idMap[t[k]]});migrateTrip(t);trips.push(t);n++}});
        if(d.master){
          (d.master.veh||[]).forEach(v=>{if(!master.veh.includes(v))master.veh.push(v)});
          (d.master.trn||[]).forEach(x=>{if(x&&x.n&&!master.trn.some(y=>y.n===x.n))master.trn.push(x)});
          (d.master.term||[]).forEach(v=>{if(!master.term.includes(v))master.term.push(v)});
          (d.master.omc||[]).forEach(v=>{if(!master.omc.includes(v))master.omc.push(v)});master.termPlace=Object.assign({},d.master.termPlace||{},master.termPlace||{});
          saveM();
        }
        // old-format backups: build client / B.A masters from text names
        const kc=s=>String(s||'').trim().toLowerCase();
        trips.forEach(t=>{
          if(t.party&&!t.clientId){let c=db.clients.find(x=>kc(x.name)===kc(t.party));if(!c){c={id:'c'+uid(),name:String(t.party).trim(),address:'',gstin:'',phone:'',active:true};db.clients.push(c)}t.clientId=c.id}

    recvs,paids,statuses:newSts,status:newSts[0]||'',waitSince:newSts.some(x=>WAITING.includes(x))?(g('t-ws')||todayStr()):'',remarks:g('t-rm')
  };
  const snapT=JSON.stringify(trips);
  let saved;
  if(prevT){Object.assign(prevT,o);saved=prevT}
  else{saved=Object.assign({id:uid(),created:Date.now(),stage:'',stageTimes:{},stageLog:[],invoiceNo:'',invoiceId:''},o);trips.push(saved)}
  const stg=g('t-stage');
  if(stg&&saved.stage!==stg)setStage(saved,stg,undefined,true);
  if(STAGES.indexOf(saved.stage)>=S_UC){const u=$('#t-uct').value;if(u){const ms=new Date(u).getTime();if(ms)saved.stageTimes[STAGES[S_UC]]=ms}}
  syncPay(saved);
  if(becamePaid)saved.paidOn=todayStr();
  if(!save()){trips=JSON.parse(snapT);return}
  toast('✅ Saved');show('list');if(becamePaid)sendWA(saved.id);
};

const LT={recv:'Payment Received',paid:'Payment Made',wd:'Personal Withdrawal'};
function ledgerRows(){
  const start=db.settings.ledgerStart,rows=[],G={};
  db.ledger.forEach(e=>{if(e.date>=start)rows.push(Object.assign({},e,{src:'manual'}))});
  trips.forEach(t=>{[['recvs','recv'],['paids','paid']].forEach(([k,ty])=>{(t[k]||[]).forEach(p=>{
    if(!p.bank||!(p.date>=start)||!(num(p.amt)>0))return;
    const key=ty+':'+(p.grp||p.id);
    const g=G[key]||(G[key]={id:'T'+key,type:ty,date:p.date,amt:0,src:'trip',key,pays:[],created:t.created||0,trs:[],ref:p.ref});
    g.amt+=num(p.amt);g.pays.push({t,p});if(!g.trs.includes(t))g.trs.push(t);
  })})});
  Object.values(G).forEach(g=>{
    g.amt=r2(g.amt);
    g.remarks=(g.trs.length===1?g.trs[0].vehicle+' · '+cliName(g.trs[0])+(g.type==='paid'?' → '+g.trs[0].tname:''):g.trs.length+' trips · '+[...new Set(g.trs.map(x=>g.type==='recv'?cliName(x):x.tname))].join(', '))+(g.ref?' · Ref '+g.ref:'')+(g.trs.some(x=>x.invoiceNo)&&g.type==='recv'?' · '+[...new Set(g.trs.map(x=>x.invoiceNo).filter(Boolean))].join(', '):'');
    rows.push(g);
  });
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0)||String(a.id).localeCompare(String(b.id)));
  let bal=num(db.settings.openAmt);
  rows.forEach(r=>{bal=r2(bal+(r.type==='recv'?r.amt:-r.amt));r.bal=bal});
  return rows;
}
let aPer='ledger';
function aRange(){
  if(aPer==='month'){const m=$('#a-mon').value||todayStr().slice(0,7);return{from:m+'-01',to:m+'-31',label:monLabel(m),m}}
  if(aPer==='all')return{from:'',to:'',label:'All time'};
  return{from:db.settings.ledgerStart,to:'',label:'Since '+fmtD(db.settings.ledgerStart)};
}
const inR=(d,R)=>(!R.from||d>=R.from)&&(!R.to||d<=R.to);
function accTotals(R){
  const L=ledgerRows();
  const inL=L.filter(r=>inR(r.date,R));
  const sm=ty=>r2(inL.filter(r=>r.type===ty).reduce((s,r)=>s+r.amt,0));
  const pt=trips.filter(t=>inR(t.date,R));
  const comm=r2(pt.reduce((s,t)=>s+num(t.comm),0));
  const rec=sm('recv'),paid=sm('paid'),wd=sm('wd');
  const before=L.filter(r=>R.from&&r.date<R.from);
  const opening=r2(num(db.settings.openAmt)+before.reduce((s,r)=>s+(r.type==='recv'?r.amt:-r.amt),0));
  const closing=r2(opening+rec-paid-wd);
  let toCollect=0,toPay=0;trips.forEach(t=>{const c=calc(t);toCollect+=c.partyDue;toPay+=c.transDue});
  return{L,inL,comm,rec,paid,wd,opening,closing,toCollect:r2(toCollect),toPay:r2(toPay),surplus:r2(comm-wd),gstDiff:r2(rec-comm),gst:Math.max(0,r2(rec-comm))};
}

/* allocate a payment over trips (oldest first); returns false if it exceeds what is due */
function allocate(list,kind,amt,date,ref,bank){
  const grp='g'+uid(),k=kind==='r'?'recvs':'paids';
  let left=r2(amt);
  const sorted=list.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0));
  const due=t=>kind==='r'?calc(t).partyDue:calc(t).transDue;
  if(left>r2(sorted.reduce((s,t)=>s+due(t),0))+0.005)return false;
  sorted.forEach(t=>{
    if(left<=0.004)return;const d=due(t);if(d<=0)return;
    const a=r2(Math.min(d,left));left=r2(left-a);
    t[k].push({id:uid(),date,amt:a,ref,bank,grp});syncPay(t);
  });
  return true;
}
function payModal(kind,fixed){

    if(fixed&&fixed.party)P.value=fixed.party;

/* ---------- invoice numbering ---------- */
const pad3=n=>String(n).padStart(3,'0');
function fyOf(ds){const y=+ds.slice(0,4),m=+ds.slice(5,7),s=m>=4?y:y-1;return s+'-'+pad((s+1)%100)}
function maxSeq(fy,prefix){let mx=0;db.invoices.forEach(i=>{if(i.fy===fy&&(!prefix||i.prefix===prefix))mx=Math.max(mx,i.seq||0)});return mx}
function nextSeq(ds){const fy=fyOf(ds),p=db.settings.series.prefix;return Math.max(db.settings.series.counters[fy]||0,maxSeq(fy,p))+1}
function nextNo(ds){return db.settings.series.prefix+'/'+fyOf(ds)+'/'+pad3(nextSeq(ds))}

/* ---------- amounts ---------- */
const ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const w2=n=>n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'');
function inWords(n){
  n=Math.floor(n);if(n<=0)return 'Rupees Zero Only';
  const cr=Math.floor(n/1e7),la=Math.floor(n%1e7/1e5),th=Math.floor(n%1e5/1e3),hu=Math.floor(n%1e3/100),re=n%100;
  return ('Rupees '+(cr?w2(cr)+' Crore ':'')+(la?w2(la)+' Lakh ':'')+(th?w2(th)+' Thousand ':'')+(hu?ONES[hu]+' Hundred ':'')+(re?w2(re)+' ':'')+'Only').replace(/\s+/g,' ').trim();
}
function invCalc(lines,mode,cg,sg){
  const total=lines.reduce((s,l)=>s+l.qty*l.rate,0);
  const cgst=mode==='GST'?rh(total*cg/100):0,sgst=mode==='GST'?rh(total*sg/100):0;
  const sum=total+cgst+sgst;
  const round=rh(Math.round(sum+1e-9)-sum);
  const grand=rh(sum+round);
  return{total:rh(total),cgst,sgst,round,grand};
}
const f2=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmy=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const dMonY=s=>s?s.slice(8,10)+'-'+MONTHS[+s.slice(5,7)-1]+'-'+s.slice(0,4):'';

let busyGen=false;
function generateInvoices(cliId,ids,o){
  if(busyGen)return null;busyGen=true;
  const memT=JSON.stringify(trips),memD=JSON.stringify(db);
  const rawT=localStorage.getItem(KEY),rawD=localStorage.getItem(DKEY);
  try{
    loadAll();trips.forEach(migrateTrip);                       // take the latest stored data (safe if app open twice)
    const sel=ids.map(id=>trips.find(t=>t.id===id));
    if(sel.some(t=>!t))throw new Error('A selected trip no longer exists');
    if(sel.some(t=>t.invoiceNo))throw new Error('A selected trip is already billed');
    const modes=[...new Set(sel.map(t=>t.taxMode))];
    if(modes.length!==1||!modes[0])throw new Error('Select trips of one tax type (RCM or GST)');
    if(sel.some(t=>t.clientId!==cliId))throw new Error('Trips of different clients selected');
    const cl=cliById(cliId);if(!cl)throw new Error('Client not found');
    sel.forEach(t=>{if(!(num(t.qty)>0)||!(num(t.frRate)>0))throw new Error('Trip '+t.vehicle+' ('+fmtD(t.date)+') has no quantity / rate')});
    sel.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const groups=o.separate?sel.map(t=>[t]):[sel];
    const F=db.settings.firm,made=[];
    groups.forEach(g=>{
      const fy=fyOf(o.date),seq=nextSeq(o.date),pf=db.settings.series.prefix,no=pf+'/'+fy+'/'+pad3(seq);
      if(db.invoices.some(i=>i.no===no))throw new Error('Invoice number '+no+' already exists');
      const lines=g.map(t=>({tripId:t.id,date:t.date,from:t.from,fromPlace:master.termPlace[t.from]||'',to:t.to,veh:t.vehicle,lr:t.lr||'',qty:num(t.qty),rate:num(t.frRate)}));
      const C=invCalc(lines,modes[0],F.cgst,F.sgst);
      const ds=g.map(t=>t.date).sort();
      const inv={id:'i'+uid(),no,prefix:pf,fy,seq,date:o.date,period:(o.separate?dMonY(ds[0]):(o.period||dMonY(ds[0])+' to '+dMonY(ds[ds.length-1]))),
        clientId:cl.id,client:{name:cl.name,address:cl.address||'',gstin:cl.gstin||''},mode:modes[0],firm:Object.assign({},F),cg:F.cgst,sg:F.sgst,
        tripIds:g.map(t=>t.id),lines,total:C.total,cgst:C.cgst,sgst:C.sgst,round:C.round,grand:C.grand,words:inWords(C.grand),created:Date.now(),status:'active'};
      db.invoices.push(inv);db.settings.series.counters[fy]=seq;
      let run=0;
      g.forEach((t,gi)=>{
        const la=num(t.qty)*num(t.frRate);
        const sh=gi===g.length-1?rh(C.grand-run):rh(C.grand*la/(C.total||1));run=rh(run+sh);
        t.billGross=sh;                                       // this trip's share of the invoice total (incl. GST / round-off)
        t.invoiceNo=no;t.invoiceId=inv.id;t.billedOn=o.date;
        setStage(t,STAGES[S_BILL],undefined,true);
        if(!t.statuses.includes('Bill Company Done'))t.statuses.push('Bill Company Done');
        t.status=t.statuses[0]||'';
      });
      made.push(inv);
    });
    wr(KEY,trips);wr(DKEY,db);                                  // throws if the phone's storage is full
    return made;
  }catch(err){
    try{trips=JSON.parse(memT);db=JSON.parse(memD);rawT===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,rawT);rawD===null?localStorage.removeItem(DKEY):localStorage.setItem(DKEY,rawD)}catch(e2){}
    toast('⚠ Invoice not created: '+(err&&err.message||'error')+'. Nothing was changed.');
    return null;
  }finally{busyGen=false}
}
function invPaid(inv){
  const ts=trips.filter(t=>t.invoiceId===inv.id);
  const out=r2(ts.reduce((s,t)=>s+calc(t).partyDue,0));
  const rec=r2(ts.reduce((s,t)=>s+num(t.recvAmt),0));
  return{rec,out};
}
function billHist(){
  const q=($('#b-hq')||{}).value||'';
  const l=db.invoices.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  let h='<input id="b-hq" placeholder="🔍 Invoice no. / client" value="'+esc(q)+'"><div id="b-hl" style="margin-top:10px">'+histRows(q)+'</div>';
  if(!l.length)h='<div class="empty">No invoices yet.</div>';
  $('#b-body').innerHTML=h;
  const i=$('#b-hq');if(i)i.oninput=()=>{$('#b-hl').innerHTML=histRows(i.value)};
}
function histRows(q){
  q=(q||'').toLowerCase();
  return db.invoices.slice().sort((a,b)=>(b.created||0)-(a.created||0)).filter(i=>!q||(i.no+' '+i.client.name).toLowerCase().includes(q)).map(i=>{
    const p=invPaid(i),can=i.status==='cancelled';
    return '<div class="card" style="'+(can?'opacity:.6':'')+'"><div class="top"><span class="veh" style="font-size:16px">'+esc(i.no)+'</span><span class="badge '+i.mode.toLowerCase()+'">'+i.mode+'</span></div>'+
     '<div class="meta">'+dMonY(i.date)+' · <b>'+esc(i.client.name)+'</b><br>'+i.tripIds.length+' trip(s) · '+esc(i.period)+'<br>Bill amount: <b>'+inr2(i.grand)+'</b>'+(can?' · <span class="badge off">CANCELLED</span>':'<br>Received: <b class="grn">'+inr2(p.rec)+'</b> · Outstanding: <b class="red">'+inr2(p.out)+'</b>')+'</div>'+
     '<div class="mini"><button class="btn2" data-iv="view" data-id="'+i.id+'">👁 View / Print</button>'+(can?'':(p.out>0?'<button class="btn2 g" data-iv="pay" data-id="'+i.id+'">＋ Payment</button>':'')+'<button class="btn2 r" data-iv="can" data-id="'+i.id+'">Cancel</button>')+'</div></div>';
  }).join('')||'<div class="empty">No match.</div>';
}
function invAction(a,id){
  const inv=db.invoices.find(x=>x.id===id);if(!inv)return;
  if(a==='view')return viewInvoice(id);
  if(a==='pay'){
    // receive against this invoice: pre-select client + invoice
    return payModal('r',{party:inv.clientId,invoice:inv.no});
  }
  if(a==='can')return ask('Cancel invoice <b>'+esc(inv.no)+'</b>?<br><br>Its trips become unbilled again and can be billed on a new invoice. The number <b>'+esc(inv.no)+'</b> is kept as cancelled and is never reused. Payments already recorded on the trips are not changed.','Cancel invoice',()=>{
    const snap=JSON.stringify(trips),sd=JSON.stringify(db);
    try{
      inv.status='cancelled';inv.cancelledAt=Date.now();
      trips.filter(t=>t.invoiceId===inv.id).forEach(t=>{
        t.invoiceNo='';t.invoiceId='';t.billedOn='';delete t.billGross;
        t.statuses=t.statuses.filter(x=>x!=='Bill Company Done');t.status=t.statuses[0]||'';
        const log=t.stageLog||[];let k=-1;for(let i=log.length-1;i>=0;i--)if(log[i].s===STAGES[S_BILL]){k=i;break}
        const prev=k>0?log[k-1].s:STAGES[S_UC];
        if(t.stage===STAGES[S_BILL])setStage(t,prev,undefined,true);
      });
      wr(KEY,trips);wr(DKEY,db);toast('Invoice cancelled');
    }catch(e){trips=JSON.parse(snap);db=JSON.parse(sd);toast('⚠ Could not cancel')}
    billHist();
  },true);
}

/* ---------- Analysis ---------- */
let nMode='m';
$('#n-month').value=todayStr().slice(0,7);$('#n-year').value=todayStr().slice(0,4);
$('#n-mode').onchange=()=>{nMode=$('#n-mode').value;renderAna()};
$('#n-prev').onclick=()=>shiftMon('#n-month',-1,renderAna);
$('#n-next').onclick=()=>shiftMon('#n-month',1,renderAna);
$('#n-month').addEventListener('change',renderAna);$('#n-year').addEventListener('input',renderAna);
const pct=(a,b)=>b?(Math.round(a/b*1000)/10)+'%':'0%';
function groupBy(list,keyFn,nameFn){
  const m={};list.forEach(t=>{const k=keyFn(t)||'(none)';const g=m[k]||(m[k]={n:nameFn(t)||'(not set)',trips:0,comm:0});g.trips++;g.comm+=num(t.comm)});return Object.values(m);
}
function monthsBetween(first){
  if(!first)return 1;const n=new Date();return Math.max(1,(n.getFullYear()-(+first.slice(0,4)))*12+(n.getMonth()+1-(+first.slice(5,7)))+1);
}
function renderAna(){
  $('#n-mode').value=nMode;
  $('#n-mrow').style.display=nMode==='m'?'':'none';$('#n-year').style.display=nMode==='y'?'':'none';
  let pre='',label='All time';
  if(nMode==='m'){pre=$('#n-month').value||todayStr().slice(0,7);label=monLabel(pre)}
  else if(nMode==='y'){pre=String($('#n-year').value||todayStr().slice(0,4));label='Year '+pre}
  const P=trips.filter(t=>(t.date||'').startsWith(pre));
  const L=ledgerRows().filter(r=>r.date.startsWith(pre));
  const lsum=ty=>r2(L.filter(r=>r.type===ty).reduce((s,r)=>s+r.amt,0));
  const commP=r2(P.reduce((s,t)=>s+num(t.comm),0));
  let h='<div class="mc"><h3>📌 '+esc(label)+'</h3>'+
   '<div class="kv"><span>Total trips</span><b>'+P.length+'</b></div><div class="kv"><span>Commission</span><b>'+inr(commP)+'</b></div>'+
   '<div class="kv"><span>Payments received (bank ledger)</span><b class="grn">'+inr(lsum('recv'))+'</b></div><div class="kv"><span>Payments made (bank ledger)</span><b>'+inr(lsum('paid'))+'</b></div>'+
   '<div class="kv"><span>Outstanding from clients (these trips)</span><b class="red">'+inr(P.reduce((s,t)=>s+calc(t).partyDue,0))+'</b></div><div class="kv"><span>Outstanding to transporters (these trips)</span><b class="red">'+inr(P.reduce((s,t)=>s+calc(t).transDue,0))+'</b></div></div>';
  const tbl=(title,head,rowsH)=>'<div class="mc"><h3>'+title+'</h3><div class="scroll"><table class="t"><tr>'+head.map((x,i)=>'<th'+(i?' class="r"':'')+'>'+x+'</th>').join('')+'</tr>'+(rowsH||'<tr><td colspan="'+head.length+'">No data</td></tr>')+'</table></div></div>';
  // client / vehicle
  h+=tbl('🏢 Client-wise trips',['Client','Trips','Commission'],groupBy(P,t=>t.clientId||cliName(t),cliName).sort((a,b)=>b.trips-a.trips).map(g=>'<tr><td>'+esc(g.n)+'</td><td class="r">'+g.trips+'</td><td class="r">'+inr(g.comm)+'</td></tr>').join(''));
  h+=tbl('🚛 Vehicle-wise trips',['Vehicle','Trips','Commission'],groupBy(P,t=>t.vehicle,t=>t.vehicle).sort((a,b)=>b.trips-a.trips).map(g=>'<tr><td>'+esc(g.n)+'</td><td class="r">'+g.trips+'</td><td class="r">'+inr(g.comm)+'</td></tr>').join(''));
  // driver-wise
  const dg=groupBy(P,t=>t.driverId||'',drvName).sort((a,b)=>b.trips-a.trips);
  h+=tbl('👤 Driver-wise',['Driver','Total trips','This period','Commission','Avg/month'],dg.map(g=>{
    const key=Object.keys({}).length;const allT=trips.filter(t=>drvName(t)===g.n||(g.n==='(not set)'&&!drvName(t)));
    const first=allT.map(t=>t.date).filter(Boolean).sort()[0];
    return '<tr><td>'+esc(g.n)+'</td><td class="r">'+allT.length+'</td><td class="r">'+g.trips+'</td><td class="r">'+inr(g.comm)+'</td><td class="r">'+(Math.round(allT.length/monthsBetween(first)*10)/10)+'</td></tr>'}).join(''));
  // B.A / Direct
  const baT=P.filter(t=>t.tripSource==='BA'),diT=P.filter(t=>t.tripSource==='Direct'),unT=P.filter(t=>t.tripSource!=='BA'&&t.tripSource!=='Direct');
  const cls=baT.length+diT.length,commBA=r2(baT.reduce((s,t)=>s+num(t.comm),0)),commDI=r2(diT.reduce((s,t)=>s+num(t.comm),0));
  const bg=groupBy(baT,t=>t.baId||baName(t),baName).sort((a,b)=>b.trips-a.trips);
  h+=tbl('🧾 B.A-wise',['B.A','Total trips','This period','Commission','% of B.A trips'],bg.map(g=>{
    const allT=trips.filter(t=>t.tripSource==='BA'&&baName(t)===g.n);
    return '<tr><td>'+esc(g.n)+'</td><td class="r">'+allT.length+'</td><td class="r">'+g.trips+'</td><td class="r">'+inr(g.comm)+'</td><td class="r">'+pct(g.trips,baT.length)+'</td></tr>'}).join(''));
  const allDi=trips.filter(t=>t.tripSource==='Direct').length;
  h+='<div class="mc"><h3>🤝 Direct trips</h3><div class="kv"><span>Total direct trips (all time)</span><b>'+allDi+'</b></div><div class="kv"><span>Direct trips in '+esc(label)+'</span><b>'+diT.length+'</b></div><div class="kv"><span>Direct commission</span><b>'+inr(commDI)+'</b></div><div class="kv"><span>% of total trips</span><b>'+pct(diT.length,P.length)+'</b></div></div>';
  // comparison
  const bar=(l,v,tot,c)=>'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+l+'</span><b>'+v+' · '+pct(v,tot)+'</b></div><div style="background:#e6ece8;border-radius:8px;height:18px"><div style="width:'+(tot?v/tot*100:0)+'%;background:'+c+';height:18px;border-radius:8px"></div></div></div>';
  h+='<div class="mc"><h3>⚖ B.A vs Direct</h3>'+bar('B.A trips',baT.length,P.length,'#4527a0')+bar('Direct trips',diT.length,P.length,'#00695c')+(unT.length?bar('Not classified (old trips)',unT.length,P.length,'#90a4ae'):'')+
   '<div class="scroll"><table class="t" style="margin-top:10px"><tr><th>Type</th><th class="r">Trips</th><th class="r">% trips</th><th class="r">Commission</th><th class="r">% comm.</th></tr>'+
   '<tr><td>B.A</td><td class="r">'+baT.length+'</td><td class="r">'+pct(baT.length,cls)+'</td><td class="r">'+inr(commBA)+'</td><td class="r">'+pct(commBA,commBA+commDI)+'</td></tr>'+
   '<tr><td>Direct</td><td class="r">'+diT.length+'</td><td class="r">'+pct(diT.length,cls)+'</td><td class="r">'+inr(commDI)+'</td><td class="r">'+pct(commDI,commBA+commDI)+'</td></tr>'+
   '<tr><td><b>Total classified</b></td><td class="r"><b>'+cls+'</b></td><td class="r"><b>'+(cls?'100%':'0%')+'</b></td><td class="r"><b>'+inr(commBA+commDI)+'</b></td><td class="r"><b>'+((commBA+commDI)?'100%':'0%')+'</b></td></tr></table></div>'+
   (unT.length?'<div class="note">'+unT.length+' older trip(s) have no B.A / Direct set. Open them in Trips → Edit to classify; they are not counted above.</div>':'')+'</div>';
  $('#n-body').innerHTML=h;
}
